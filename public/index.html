<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>minimi agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f5bd3'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3Em%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar" class="sidebar" aria-label="Your chats">
    <button id="new-chat" class="new-chat" type="button">+ New chat</button>
    <button id="open-memory" class="memory-link" type="button">🧠 What I remember</button>
    <nav id="chat-list" class="chat-list"></nav>
    <div class="who">
      <span id="user-name" class="user-name"></span>
      <button id="switch-user" class="link" type="button">Switch user</button>
    </div>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>

  <div class="main">
    <header class="top">
      <button id="toggle-sidebar" class="ghost menu" type="button" aria-label="Show chats">☰</button>
      <div id="title" class="title">minimi <span>agent</span></div>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <form id="ask" class="ask">
      <textarea id="question" rows="1" placeholder="Ask a question…" aria-label="Your question"></textarea>
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" class="stop" hidden>Stop</button>
    </form>
  </div>

  <div id="picker" class="picker" hidden>
    <form id="picker-form" class="picker-box">
      <h2>Who are you?</h2>
      <p>Type your name. Your chats are kept separate from other people's.</p>
      <input id="picker-name" type="text" maxlength="40" autocomplete="username" placeholder="Your name" aria-label="Your name">
      <div id="picker-error" class="picker-error" hidden></div>
      <button type="submit">Continue</button>
      <small>No password: this is a local app. Anyone using this computer can pick any name.</small>
    </form>
  </div>

  <template id="empty-template">
    <section class="empty">
      <h1>Ask anything that needs the web.</h1>
      <p>Answers come with sources and the date they were checked. Your chats are saved.</p>
      <div class="examples">
        <button type="button" class="example">What does Supabase Pro cost per month right now?</button>
        <button type="button" class="example">Compare HubSpot, Pipedrive and Salesforce pricing for 20 users.</button>
        <button type="button" class="example">Did Vercel ship anything big this week?</button>
      </div>
    </section>
  </template>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/app.js"></script>
</body>
</html>
